<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margem Segura</title>
<meta name="theme-color" content="#1D6B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Margem Segura">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --ink:#142019; --muted:#4F5E55; --line:#DCE3DD; --line2:#EEF2EE; --field:#F7F9F6;
  --green:#1D6B47; --green-ink:#FFFFFF; --green-soft:#E4F1E8; --green-text:#14502F;
  --tag:#FFD84D; --tag-ink:#1B1600;
  --red:#B42318; --red-soft:#FDECEA; --red-text:#8A1C12;
  --amber:#B54708; --amber-soft:#FEF0E1; --amber-text:#8A3A06;
  --c-custo:#7A8B80; --c-imp:#C98A2B; --c-tx:#E0B866; --c-perda:#C0564B; --c-desp:#5C7FA8; --c-lucro:#1F9D5C;
  --num:"Space Grotesk",Inter,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1612; --surface:#17231D; --ink:#E9F0EB; --muted:#A3B5A9; --line:#2A3A31; --line2:#223029; --field:#1E2D25;
    --green:#4FB57F; --green-ink:#0B1410; --green-soft:#1B3326; --green-text:#8FE0B2;
    --red:#FF8A80; --red-soft:#3A1F1C; --red-text:#FFB4AB;
    --amber:#FFB46B; --amber-soft:#3A2A17; --amber-text:#FFCB94;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#17231D; --ink:#E9F0EB; --muted:#A3B5A9; --line:#2A3A31; --line2:#223029; --field:#1E2D25;
  --green:#4FB57F; --green-ink:#0B1410; --green-soft:#1B3326; --green-text:#8FE0B2;
  --red:#FF8A80; --red-soft:#3A1F1C; --red-text:#FFB4AB;
  --amber:#FFB46B; --amber-soft:#3A2A17; --amber-text:#FFCB94;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
main.screen{padding-bottom:120px}
h1{margin:0;font-family:var(--num);font-size:26px;line-height:1.15;font-weight:700}
h2{margin:0;font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:50px}
input:focus,select:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.pre,.suf{position:relative}
.pre span,.suf span{position:absolute;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none;font-size:15px}
.pre span{left:12px}.pre input{padding-left:40px}
.suf span{right:12px}.suf input{padding-right:34px}
.big input{font-family:var(--num);font-size:28px;font-weight:700;min-height:60px;border:1.5px solid var(--green)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;min-height:50px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:15px}
.btn{background:var(--green);color:var(--green-ink);width:100%}
.btn.xl{min-height:58px;font-size:17px}
.btn.ghost{background:var(--surface);color:var(--green);border:1.5px solid var(--green)}
.btn.plain{background:transparent;color:var(--green);width:auto;padding:0 8px;min-height:44px}
.btn.danger{background:transparent;color:var(--red);width:auto;min-height:44px;padding:0 8px}
.btn svg{flex:none}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.msg.red{background:var(--red-soft);color:var(--red-text)}
.msg.amber{background:var(--amber-soft);color:var(--amber-text)}
.msg.green{background:var(--green-soft);color:var(--green-text)}
.msg.info{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.hint{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search input{border:0;background:transparent;padding:0;min-height:50px}
.search input:focus{outline:none}
.search:focus-within{outline:3px solid var(--green);outline-offset:2px}

/* etiqueta */
.tag{background:var(--tag);color:var(--tag-ink);border-radius:8px 20px 20px 8px;padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.tag .l{font-size:13px;font-weight:600}
.tag .v{font-family:var(--num);font-size:46px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.tag .s{font-size:13px;font-weight:600}
.tag.sm .v{font-size:34px}
.minline{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.minline span{color:var(--muted)}
.minline b{font-family:var(--num);font-size:16px}

/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:66px;border-bottom:1px solid var(--line2);color:var(--ink);text-decoration:none;background:transparent;width:100%;text-align:left;border-radius:0;font-weight:400;font-size:16px}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{font-size:13px;color:var(--muted)}
.row .p{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.row .p b{font-family:var(--num);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.row .p small{font-size:12px;color:var(--muted)}
.st{font-size:12px;font-weight:700}
.st.red{color:var(--red)}.st.amber{color:var(--amber)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.red{color:var(--red-text);background:var(--red-soft)}
.pill.amber{color:var(--amber-text);background:var(--amber-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--num);font-size:26px;font-weight:700}
.kpi span{font-size:12px;line-height:1.3;color:var(--muted)}
.kpi.red{background:var(--red-soft);border-color:transparent}
.kpi.red b{color:var(--red)}.kpi.red span{color:var(--red-text)}
.bar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--line2)}
.bar div{height:100%}
.leg{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.leg i{width:12px;height:12px;border-radius:3px;display:block}
.leg b{text-align:right}
.progress{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}
.progress div{height:100%;background:var(--green);border-radius:999px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;min-height:44px;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;font-weight:600;border-radius:12px}
.stepper b{min-width:56px;text-align:center;font-family:var(--num);font-size:22px}
details.card{display:block}
details summary{cursor:pointer;list-style:none;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:30px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:22px;color:var(--muted);font-weight:500}
details[open] summary::after{content:"–"}
details[open] summary{margin-bottom:12px}
.catrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.catrow input.nm{flex:1;min-height:44px;font-size:15px}
.catrow .suf{width:92px;flex:none}
.catrow .suf input{min-height:44px;text-align:right;font-size:15px;padding:0 26px 0 8px}
.x{background:transparent;color:var(--muted);width:44px;min-height:44px;padding:0;font-size:22px;flex:none}
.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px;min-height:auto;line-height:1.35;font-weight:400}
.opt b{display:block;font-size:16px;font-weight:700}
.opt small{color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt .ic{display:flex;gap:12px;align-items:flex-start}
.terms{font-size:13px;line-height:1.5;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px}
.terms p{margin:0 0 8px}.terms p:last-child{margin:0}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:600;margin:0;cursor:pointer}
.check input{width:24px;height:24px;min-height:24px;flex:none;margin:0;accent-color:var(--green)}
.steps{display:grid;gap:6px;margin-bottom:6px}
.steps i{height:5px;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--green)}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;border:2px dashed var(--line);background:var(--surface);border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer}
.drop:focus-within{outline:3px solid var(--green);outline-offset:2px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{font-size:16px}
.map{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.map:last-child{border-bottom:0}
.map div{flex:1}
.map select{width:160px;min-height:46px;font-size:15px}
.cnt{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px}
.cnt b{font-family:var(--num);font-size:24px;min-width:42px}
.cnt span{flex:1;font-size:14px;font-weight:600}

/* barras fixas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar button{flex-direction:column;gap:3px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;min-height:52px;border-radius:10px;padding:0}
.tabbar button[aria-current="page"]{color:var(--green);font-weight:700}
.tabbar .ico{width:22px;height:22px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line);margin:-20px -16px 16px;padding:8px 8px}
.topbar div{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar h1{font-family:Inter,system-ui,sans-serif;font-size:17px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.actionbar div.in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.toast{text-align:center;font-size:14px;font-weight:700;color:var(--green-text)}
.hidden{display:none !important}
.toastTop{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:60;background:var(--green);color:var(--green-ink);font-weight:700;font-size:15px;line-height:1.3;padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:92vw;text-align:center;display:flex;align-items:center;gap:8px}
.cambtn{flex:none;width:50px;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);position:relative}
.cambtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cambtn:focus-within{outline:3px solid var(--green);outline-offset:2px}
.search .cambtn{border:0;background:transparent;width:44px;min-height:44px;color:var(--green)}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.ck.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.ck .ico{width:16px;height:16px;stroke-width:3}
.row.sel{background:var(--green-soft)}
.btn.del{background:var(--red);color:#fff}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  'use strict';
  /* ===== CONFIGURAÇÃO DA SUA MARCA (edite aqui) ===== */
  var CONFIG = {
    nome: 'Margem Segura',
    empresa: 'Criado por Jaqueline Matos',                 // ex.: 'Sua Empresa Ltda'
    whatsappSuporte: '5511947185525',         // só números com DDI e DDD, ex.: '5511999999999'
    versao: '2.5.3'
  };
  var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  var PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';

  /* ===== dados-base ===== */
  var BASE=[
    ['Cesta básica (arroz, feijão, óleo, açúcar, café)',25],['Leites e laticínios',32],['Frios',35],['Padaria',40],
    ['Hortifruti',40],['Mercearia',35],['Massas e molhos',38],['Biscoitos e salgadinhos',45],['Doces e bomboniere',55],
    ['Refrigerantes e sucos',33],['Águas',45],['Cervejas',33],['Vinhos e destilados',45],['Energéticos e isotônicos',40],
    ['Congelados',38],['Sorvetes',42],['Limpeza',38],['Higiene e beleza',40],['Pet',45],['Descartáveis e utilidades',48],['Gelo e carvão',45]
  ];
  var PUB={
    A:{n:'Público de renda alta',d:'Compra por conveniência e se importa menos com preço.',aj:5,c:'Público A'},
    B:{n:'Público de renda média',d:'Compara alguns preços, mas valoriza a praticidade.',aj:0,c:'Público B'},
    C:{n:'Público econômico',d:'Compara bastante com o mercado grande.',aj:-5,c:'Público C'}
  };
  var TERMOS='<p><b>Termos de uso</b></p>'+
    '<p>A Margem Segura é uma ferramenta de apoio. As margens sugeridas são pontos de partida e não garantem lucro.</p>'+
    '<p>Você é responsável pelos preços que definir, pelos impostos e pelas regras do seu negócio. Confirme a alíquota de imposto com seu contador.</p>'+
    '<p>Esta versão considera empresas do Simples Nacional que recolhem os tributos pelo DAS. Ajustes da Reforma Tributária serão incluídos em atualizações.</p>'+
    '<p>Seus dados ficam só neste aparelho. Nada é enviado para a internet.</p>'+
    '<p>Garantia de 7 dias: se não ficar satisfeito, peça o reembolso pela plataforma de compra.</p>';

  /* ===== utilidades ===== */
  var root=document.getElementById('root');
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var num=function(v){
    if(typeof v==='number') return isFinite(v)?v:0;
    var s=String(v==null?'':v).trim().replace(/R\$/gi,'').replace(/\s/g,'');
    if(!s) return 0;
    if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
    var n=parseFloat(s); return isNaN(n)?0:n;
  };
  var fmt=function(n){ if(!isFinite(n)) n=0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); };
  var fmt0=function(n){ if(!isFinite(n)) n=0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}); };
  var pct=function(n){ return Math.round(n*100)+'%'; };
  var dec=function(n){ return String(Math.round(n*100)/100).replace('.',','); };
  var norm=function(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); };
  var uid=function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); };
  var IC={
    home:'<path d="M3 10.5 12 3l9 7.5V21h-7v-6h-4v6H3z"/>',
    list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
    chart:'<path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    back:'<path d="M15 18l-6-6 6-6"/>',
    chev:'<path d="M9 6l6 6-6 6"/>',
    check:'<path d="M5 12l5 5L20 7"/>',
    file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
    cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'
  };
  var ico=function(k,cls){ return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg>'; };

  /* ===== estado ===== */
  var KEY='calc-precos-produto-v2', KEY_OLD='calc-precos-produto-v1';
  var S, V={tab:'inicio',screen:null,edit:null,imp:null,wiz:1,wpub:'B',filtro:'Todos',busca:'',hb:'',qc:{cat:null,custo:''}};
  function novasCats(pub){
    var aj=PUB[pub||'B'].aj;
    return BASE.map(function(b,i){ return {id:'c'+i,n:b[0],m:Math.max(10,b[1]+aj)}; });
  }
  function padrao(){
    return {cfg:{setup:false,aceite:false,neg:'',pub:'B',imp:'4',perd:'3',taxa:'2',desp:'',vend:'',arred:'90',meta:'',mmed:''},cats:novasCats('B'),prods:[],imports:[],dica:true};
  }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  function load(){
    S=padrao();
    try{
      var r=localStorage.getItem(KEY);
      if(r){ var o=JSON.parse(r); if(o&&o.cfg){ S.cfg=Object.assign(S.cfg,o.cfg); if(o.cats&&o.cats.length) S.cats=o.cats; if(o.prods) S.prods=o.prods; if(o.imports) S.imports=o.imports; S.dica=o.dica!==false; } return; }
      var old=localStorage.getItem(KEY_OLD);
      if(old){
        var v=JSON.parse(old);
        ['neg','pub','imp','perd','taxa','desp','vend','arred','meta','mmed'].forEach(function(k){ if(v[k]!=null) S.cfg[k]=String(v[k]); });
        if(v.cats&&v.cats.length) S.cats=v.cats.map(function(c,i){ return {id:c.id||('c'+i),n:c.n,m:num(c.m)}; });
        S.cfg.setup=!!v.setup; S.cfg.aceite=!!v.setup;
        (v.list||[]).forEach(function(it){
          var cat=S.cats.filter(function(c){ return norm(c.n).indexOf(norm(it.c))===0; })[0]||S.cats[0];
          S.prods.push({id:uid(),n:it.n||'Sem nome',cat:cat.id,custo:num(it.k),aj:0,ean:'',atual:0,mkt:0,ts:it.ts||Date.now()});
        });

      }

  /* ===== cálculo ===== */
  function cfgN(k){ return num(S.cfg[k]); }
  function despPct(){ var d=cfgN('desp'), v=cfgN('vend'); return d>0&&v>0 ? d/v : 0; }
  function catById(id){ for(var i=0;i<S.cats.length;i++) if(S.cats[i].id===id) return S.cats[i]; return S.cats[0]; }
  function roundP(x){
    var r=S.cfg.arred; if(!(x>0)) return 0;
    if(r==='0') return Math.round(x*100)/100;
    if(r==='05') return Math.ceil(x*20-1e-9)/20;
    var e=r==='99'?0.99:0.90, c=Math.floor(x)+e;
    if(c<x-1e-9) c=Math.floor(x)+1+e;
    return Math.round(c*100)/100;
  }
  function margemDe(catId,aj){ var c=catById(catId); return Math.min(Math.max((num(c.m)+(aj||0))/100,0.01),0.9); }
  function calc(c,m,atual){
    var imp=cfgN('imp')/100, tx=cfgN('taxa')/100, q=Math.min(cfgN('perd')/100,0.5), dp=despPct();
    var ex=c>0?c/(1-m):0, P=roundP(ex);
    var den=1-imp-tx-dp, min=(c>0&&den>0.05)?(c/(1-q))/den:0;
    var usado=atual>0?atual:P;
    var r={ex:ex,P:P,min:min,usado:usado,temDesp:dp>0,den:den};
    r.vImp=usado*imp; r.vTx=usado*tx; r.vPer=c*q/(1-q); r.vDesp=usado*dp;
    r.vL=usado-c-r.vImp-r.vTx-r.vPer-r.vDesp;
    r.arred=!(atual>0)&&ex>0&&(P-ex)/ex>0.08&&(P-ex)>=0.2;
    r.st= c<=0?'none':((min>0&&usado<min-0.004)?'red':(r.arred?'amber':'ok'));
    r.margem=usado>0?(usado-c)/usado:0;
    return r;
  }
  function calcProd(p){ return calc(num(p.custo),margemDe(p.cat,p.aj),num(p.atual)); }
  function stats(){
    var n=S.prods.length, red=0, amb=0, sm=0, sc=0;
    S.prods.forEach(function(p){ var r=calcProd(p); if(r.st==='none'){ sc++; return; } if(r.st==='red') red++; if(r.st==='amber') amb++; sm+=r.margem; });
    return {n:n,red:red,amb:amb,att:red+amb,sc:sc,mm:(n-sc)?sm/(n-sc):0};
  }
  function catAvg(){ var t=0; S.cats.forEach(function(c){ t+=num(c.m); }); return S.cats.length?t/S.cats.length/100:0.35; }
  function metaCalc(){
    var st=stats(), auto=st.n?st.mm:catAvg();
    var mm=num(S.cfg.mmed)>0?num(S.cfg.mmed)/100:auto;
    var imp=cfgN('imp')/100, tx=cfgN('taxa')/100, q=Math.min(cfgN('perd')/100,0.5);
    var desp=cfgN('desp'), vend=cfgN('vend'), meta=cfgN('meta');
    var contrib=mm-imp-tx-q*(1-mm)/(1-q);
    var ok=contrib>0.01&&desp>0;
    return {auto:auto,mm:mm,contrib:contrib,ok:ok,desp:desp,vend:vend,meta:meta,pe:ok?desp/contrib:0,alvo:ok?(desp+meta)/contrib:0,hoje:vend*contrib-desp};
  }

  function autoMap(headers){
    var H=headers.map(norm), used={}, map={nome:-1,custo:-1,cat:-1,ean:-1,atual:-1};
    function find(re,not){ for(var i=0;i<H.length;i++){ if(used[i]) continue; if(re.test(H[i]) && !(not&&not.test(H[i]))){ used[i]=1; return i; } } return -1; }
    map.custo=find(/custo|compra|pago|fornecedor|unit.*entrada/,/venda|pratic/);
    map.atual=find(/venda|pratic|prateleira|preco atual|varejo|^preco$|^valor$|preco final|pvp/,/custo|compra|pago/);
    map.ean=find(/ean|barra|gtin|cod.*barras/);
    map.cat=find(/categ|grupo|secao|departamento|familia|setor/);
    map.nome=find(/nome|descri|produto|item|mercadoria/,/cod/);
    return map;
  }
  function parseCSV(txt){
    txt=txt.replace(/^\ufeff/,'');
    var first=txt.split(/\r?\n/)[0]||'';
    var sep=(first.split(';').length>first.split(',').length)?';':(first.split('\t').length>1?'\t':',');
    var rows=[], row=[], cur='', q=false;
    for(var i=0;i<txt.length;i++){
      var ch=txt[i];
      if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; continue; }
      if(ch==='"'){ q=true; continue; }
      if(ch===sep){ row.push(cur); cur=''; continue; }
      if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; continue; }
      cur+=ch;
    }
    if(cur!==''||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function loadScript(url,glob,cb){

    s.onerror=function(){ cb(new Error('x')); };
    document.head.appendChild(s);
  }

  /* ----- nota fiscal em PDF (NFC-e) ----- */
  function linhasPDF(pages){
    var out=[];
    pages.forEach(function(pg){
      var map={};
      pg.items.forEach(function(it){ if(!it.str) return; var k=Math.round(it.y); (map[k]=map[k]||[]).push(it); });
      Object.keys(map).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){
        var t=map[y].sort(function(a,b){return a.x-b.x;}).map(function(i){return i.str;}).join('').replace(/\s+/g,' ').trim();
        if(t) out.push(t);
      });
    });
    return out;
  }
  function parseNF(lines){
    var itens=[], pend=null, prev='';
    var label=/^(Qtde|Vl\.|UN:|Valor|Qtd\.|Forma|Troco|Outros|EMISS|Número|Protocolo|Ambiente|Consulte|Chave|Consumidor|Informa|Data\/Hora|CNPJ)/i;
    lines.forEach(function(l){
      var ci=l.indexOf('(Código:');
      if(ci>=0){
        var nome=l.slice(0,ci).replace(/\s*Vl\. Total.*$/,'').trim();
        if(!nome && prev) nome=prev;
        pend={n:nome.replace(/\s+/g,' ')}; prev=''; return;
      }
      var q=/Qtde\.:\s*(\d+(?:,\d+)?).*?Vl\. Unit\.:\s*(\d{1,3}(?:\.\d{3})*,\d{2})/.exec(l);
      if(q){ if(pend&&pend.n){ pend.q=num(q[1]); pend.u=num(q[2]); itens.push(pend); } pend=null; prev=''; return; }
      if(!label.test(l) && !/^[\d.,\s)]+$/.test(l) && /[A-Za-z]{3}/.test(l)) prev=l.replace(/\s*Vl\. Total.*$/,'').trim(); else prev='';
    });
    return itens;
  }
  function infoNF(lines){
    var txt=lines.join(' '), em=/Emiss[ãa]o:\s*(\d{2}\/\d{2}\/\d{4})/.exec(txt), nn=/N[úu]mero:\s*(\d+)/.exec(txt);
    return {fornecedor:lines[0]||'',data:em?em[1]:'',numero:nn?nn[1]:''};
  }

  function adivinhaCat(nome){
    var n=norm(nome).toUpperCase();
    for(var i=0;i<REGRAS.length;i++){
      if(!REGRAS[i][0].test(n)) continue;
      var cands=REGRAS[i][1];
      for(var j=0;j<cands.length;j++){ var c=norm(cands[j]); var hit=S.cats.filter(function(k){ return norm(k.n).indexOf(c)===0; })[0]; if(hit) return hit.n; }
    }
    return '';
  }
  function lerNF(file,fim,erro){
    loadScript(PDFJS_URL,'pdfjsLib',function(err){
      if(err){ erro('Para ler PDF é preciso estar conectado à internet. Tente de novo.'); return; }
      try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; }catch(e){}
      var fr=new FileReader();
      fr.onload=function(){
        window.pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(doc){
          var pages=[], i=1;
          var next=function(){
            if(i>doc.numPages){
              var L=linhasPDF(pages), itens=parseNF(L), inf=infoNF(L);
              if(!itens.length){ erro('Não encontrei produtos neste PDF. A calculadora lê a NFC-e no formato “Consulta Resumida” do site da Fazenda. Se for outro tipo de nota, envie como planilha.'); return; }
              var agrup={}, ordem=[];
              itens.forEach(function(x){ var k=norm(x.n); if(!agrup[k]){ agrup[k]={n:x.n,q:0,u:x.u}; ordem.push(k); } agrup[k].q+=x.q; agrup[k].u=x.u; });
              var rows=[['Nome','Custo','Categoria','Quantidade na nota']].concat(ordem.map(function(k){ var x=agrup[k]; return [x.n,x.u,adivinhaCat(x.n),x.q]; }));
              V.imp.nf=inf;
              fim(rows,'NF '+(inf.numero||'')+(inf.fornecedor?' – '+inf.fornecedor:''));
              return;
            }
            doc.getPage(i).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
              pages.push({items:tc.items.map(function(it){ return {str:it.str,x:it.transform[4],y:it.transform[5]}; })}); i++; next();
            }).catch(function(){ erro('Não consegui ler o PDF.'); });
          };
          next();
        }).catch(function(){ erro('Não consegui abrir este PDF. Se ele tiver senha, remova e envie de novo.'); });
      };
      fr.onerror=function(){ erro('Não consegui ler o arquivo.'); };
      fr.readAsArrayBuffer(file);
    });
  }

  function lumDe(ctx,w,h){
    var d=ctx.getImageData(0,0,w,h).data, lum=new Uint8ClampedArray(w*h);
    for(var i=0,j=0;j<lum.length;i+=4,j++) lum[j]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
    return lum;
  }

    var r=new Z.MultiFormatReader(); r.setHints(hints);
    var src=new Z.RGBLuminanceSource(lum,w,h);
    try{ return r.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src))).getText(); }catch(e){}

  function lerCodigo(file,cb){
    var url=URL.createObjectURL(file), img=new Image();
    img.onerror=function(){ URL.revokeObjectURL(url); cb(null,'img'); };
    img.onload=function(){
      var W=img.naturalWidth, H=img.naturalHeight;
      var tentar=function(){
        loadScript(ZXING_URL,'ZXing',function(err){
          if(err){ URL.revokeObjectURL(url); cb(null,'net'); return; }
          var sizes=[1280,900,1800], res=null;
          for(var a=0;a<sizes.length&&!res;a++){
            var sc=Math.min(1,sizes[a]/Math.max(W,H)), w=Math.round(W*sc), h=Math.round(H*sc);
            for(var rot=0;rot<2&&!res;rot++){
              var cv=document.createElement('canvas'), cw=rot?h:w, ch=rot?w:h; cv.width=cw; cv.height=ch;
              var ctx=cv.getContext('2d');
              if(rot){ ctx.translate(cw,0); ctx.rotate(Math.PI/2); }
              ctx.drawImage(img,0,0,w,h);
              try{ res=decodeZX(lumDe(ctx,cw,ch),cw,ch); }catch(e){}
            }
          }
          URL.revokeObjectURL(url); cb(res,res?null:'nada');
        });
      };
      if('BarcodeDetector' in window){
        try{
          new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}).detect(img).then(function(r){
            if(r&&r.length&&r[0].rawValue){ URL.revokeObjectURL(url); cb(String(r[0].rawValue),null); } else tentar();
          }).catch(tentar);
        }catch(e){ tentar(); }
      } else tentar();
    };
    img.src=url;
  }

  function lerArquivo(file){
    var I=V.imp; I.err=null; I.loading=true; render();
    var nome=file.name||'planilha', ext=(nome.split('.').pop()||'').toLowerCase();
    I.nf=null;
    var fim=function(rows,rotulo){
      I.loading=false;
      rows=(rows||[]).map(function(r){ return (r||[]).map(function(v){ return v==null?'':v; }); });
      var hi=-1; for(var i=0;i<Math.min(rows.length,15);i++){ var nn=rows[i].filter(function(v){ return String(v).trim()!==''; }).length; if(nn>=2){ hi=i; break; } }
      if(hi<0){ I.err='Não encontrei dados nesta planilha. Confira se a primeira aba tem os produtos, com uma linha de títulos.'; render(); return; }
      var headers=rows[hi].map(function(v){ return String(v).trim(); });
      var data=rows.slice(hi+1).filter(function(r){ return r.some(function(v){ return String(v).trim()!==''; }); });
      if(!data.length){ I.err='A planilha só tem a linha de títulos. Preencha os produtos e envie de novo.'; render(); return; }
      I.fileName=rotulo||nome; I.headers=headers; I.rows=data; I.map=autoMap(headers); I.defCat=I.defCat||S.cats[0].id; I.atualizar=true; I.step=2;
      render(); window.scrollTo(0,0);
    };
    var erro=function(msg){ I.loading=false; I.err=msg; render(); };
    if(ext==='csv'||ext==='txt'){
      var fr=new FileReader();
      fr.onload=function(){
        var t=String(fr.result||'');
        if(t.indexOf('\ufffd')>=0){ var fr2=new FileReader(); fr2.onload=function(){ fim(parseCSV(String(fr2.result||''))); }; fr2.onerror=function(){ erro('Não consegui ler o arquivo.'); }; fr2.readAsText(file,'ISO-8859-1'); }
        else fim(parseCSV(t));
      };
      fr.onerror=function(){ erro('Não consegui ler o arquivo.'); };
      fr.readAsText(file,'UTF-8');
      return;
    }
    if(ext==='pdf'){ lerNF(file,fim,erro); return; }
    if(ext!=='xlsx'&&ext!=='xls'&&ext!=='xlsm'){ erro('Formato não aceito. Envie .xlsx, .xls, .csv ou a nota fiscal em PDF.'); return; }
    loadXLSX(function(err){
      if(err){ erro('Para ler arquivos do Excel é preciso estar conectado à internet na primeira vez. Tente de novo, ou salve a planilha como .csv.'); return; }
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var wb=window.XLSX.read(new Uint8Array(fr.result),{type:'array'});
          var ws=wb.Sheets[wb.SheetNames[0]];
          fim(window.XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));
        }catch(e){ erro('Não consegui abrir esta planilha. Se ela tiver senha, remova a senha e envie de novo.'); }
      };
      fr.onerror=function(){ erro('Não consegui ler o arquivo.'); };
      fr.readAsArrayBuffer(file);
    });
  }

  function catMatch(nome){
    var n=norm(nome); if(!n) return null;
    for(var i=0;i<S.cats.length;i++){ var c=norm(S.cats[i].n); if(c===n || c.split(' (')[0]===n || c.indexOf(n)===0) return S.cats[i]; }
    return null;
  }
  function findDup(nome,ean){
    var n=norm(nome);
    for(var i=0;i<S.prods.length;i++){ var p=S.prods[i]; if((ean&&p.ean&&String(p.ean)===String(ean)) || norm(p.n)===n) return p; }
    return null;
  }
  function revisar(){
    var I=V.imp, M=I.map, ok=[], sem=[], novas={}, dup=0, semC=0;
    I.rows.forEach(function(r,idx){
      var nome=M.nome>=0?String(r[M.nome]).trim():'', custo=M.custo>=0?num(r[M.custo]):0;
      if(!nome){ sem.push('linha '+(idx+2)); return; }
      if(!(custo>0)) semC++;
      var cn=M.cat>=0?String(r[M.cat]).trim():'';
      if(cn && !catMatch(cn)) novas[cn]=1;
      var ean=M.ean>=0?String(r[M.ean]).trim():'';
      if(findDup(nome,ean)) dup++;
      ok.push({n:nome,custo:custo,cn:cn,ean:ean,atual:M.atual>=0?num(r[M.atual]):0});
    });
    I.rev={ok:ok,sem:sem,novas:Object.keys(novas),dup:dup,semC:semC};
  }
  function importar(){
    var I=V.imp, R=I.rev, novos=0, at=0;
    var lote={id:'L'+uid(),ts:Date.now(),file:I.fileName,novos:[],atualizados:[],cats:[]};
    R.novas.forEach(function(n){ if(!catMatch(n)){ var nc={id:'n'+uid(),n:n,m:35}; S.cats.push(nc); lote.cats.push(nc.id); } });
    var ids=[];
    R.ok.forEach(function(x){
      var cat=x.cn?catMatch(x.cn):null; var cid=cat?cat.id:I.defCat;
      var d=findDup(x.n,x.ean);
      if(d){ if(!I.atualizar) return;
        if(lote.novos.indexOf(d.id)<0 && !lote.atualizados.some(function(a){return a.id===d.id;})) lote.atualizados.push({id:d.id,antes:{custo:d.custo,atual:d.atual,ean:d.ean,cat:d.cat}});
        if(x.custo>0) d.custo=x.custo; if(x.atual>0) d.atual=x.atual; if(x.ean) d.ean=x.ean; if(x.cn) d.cat=cid; d.ts=Date.now(); at++; ids.push(d.id); }
      else { var p={id:uid(),n:x.n,cat:cid,custo:x.custo,aj:0,ean:x.ean,atual:x.atual||0,mkt:0,ts:Date.now()}; S.prods.push(p); lote.novos.push(p.id); novos++; ids.push(p.id); }
    });
    S.imports=(S.imports||[]); S.imports.unshift(lote); S.imports=S.imports.slice(0,10); I.lote=lote.id;
    var red=0, sc=0; ids.forEach(function(id){ var p=S.prods.filter(function(z){return z.id===id;})[0]; if(!p) return; var st=calcProd(p).st; if(st==='red') red++; if(st==='none') sc++; });
    save(); I.res={total:novos+at,novos:novos,atual:at,red:red,sc:sc}; I.step=4; render(); window.scrollTo(0,0);
  }

  function desfazer(id){
    var L=(S.imports||[]).filter(function(x){ return x.id===id; })[0]; if(!L) return null;
    var rm={}; L.novos.forEach(function(i){ rm[i]=1; });
    var antes=S.prods.length;
    S.prods=S.prods.filter(function(p){ return !rm[p.id]; });
    var removidos=antes-S.prods.length, rest=0;
    L.atualizados.forEach(function(a){ var p=S.prods.filter(function(z){ return z.id===a.id; })[0]; if(p){ p.custo=a.antes.custo; p.atual=a.antes.atual; p.ean=a.antes.ean; p.cat=a.antes.cat; rest++; } });
    L.cats.forEach(function(cid){ if(!S.prods.some(function(p){ return p.cat===cid; })) S.cats=S.cats.filter(function(c){ return c.id!==cid; }); });
    S.imports=S.imports.filter(function(x){ return x.id!==id; });
    save();
    return {rem:removidos,rest:rest};
  }

  /* ===== render ===== */
  function render(){
    if(!S.cfg.setup){ root.innerHTML='<main>'+vWizard()+'</main>'; return; }
    if(V.screen==='prod'){ root.innerHTML='<main class="screen">'+vProd()+'</main>'; updProd(); return; }
    var body = V.tab==='produtos'?vProdutos():(V.tab==='importar'?vImportar():(V.tab==='negocio'?vNegocio():vInicio()));
    var hasAction = (V.tab==='importar' && V.imp && (V.imp.step===2||V.imp.step===3)) || (V.tab==='produtos' && !!V.sel && S.prods.length>0);
    root.innerHTML='<main'+(hasAction?' class="screen"':'')+'>'+body+'</main>'+(hasAction?'':tabbar());
    if(V.tab==='inicio'){ updHome(); updQuick(); }
    if(V.tab==='produtos') updLista();
    if(V.tab==='negocio'){ updMeta(); renderCats(); }
    if(V.tab==='importar' && V.imp && V.imp.step===2) updPrev();
  }

  /* ===== copiar e baixar ===== */
  function copyText(t,ok,bad){
    var fb=function(){ try{ var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var r=document.execCommand('copy'); document.body.removeChild(ta); r?ok():bad(); }catch(e){ bad(); } };
    try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,fb); else fb(); }catch(e){ fb(); }
  }
  function baixar(nome,linhas){
    var csv='\ufeff'+linhas.map(function(l){ return l.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(';'); }).join('\r\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
  }
  var toastT=null;
  function toast(msg){
    var el=document.getElementById('toastTop');
    if(!el){ el=document.createElement('div'); el.id='toastTop'; el.className='toastTop'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.innerHTML=ico('check')+'<span>'+esc(msg)+'</span>'; el.classList.remove('hidden');
    clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.add('hidden'); },3200);
  }
  var pend={};
  function confirma(key,boxId,texto){
    if(pend[key]&&Date.now()-pend[key]<6000){ pend[key]=0; if($(boxId)) $(boxId).innerHTML=''; return true; }
    pend[key]=Date.now(); if($(boxId)) $(boxId).innerHTML='<div class="msg red">'+texto+' Toque de novo para confirmar.</div>'; return false;
  }

  /* ===== eventos (delegados) ===== */
  root.addEventListener('click',function(e){
    var t=e.target.closest('button,a'); if(!t) return;

    if(d.tab){ V.undoMsg=''; if(V.qc) V.qc.salvo=null; V.sel=null; if(d.tab==='importar'&&V.imp&&V.imp.step===4) V.imp={step:1}; go(d.tab); return; }

      var np={id:uid(),n:qn,cat:qcat,custo:qc,aj:0,ean:'',atual:0,mkt:0,ts:Date.now()};
      S.prods.push(np); save();

    if(t.id==='voltar'){ V.screen=null; V.edit=null; render(); return; }
    if(t.id==='mmenos'||t.id==='mmais'){ V.edit.aj=(V.edit.aj||0)+(t.id==='mmais'?1:-1); V.saved=false; $('ptoast').innerHTML=''; updProd(); return; }
    if(t.id==='excluir'){
      if(!confirma('del','delmsg','Excluir “'+esc(V.edit.n)+'”?')){ window.scrollTo(0,0); return; }

    }
    if(t.id==='salvarP'){
      var p=V.edit, c=num(p.custo), n=String(p.n||'').trim();
      if(!n){ $('ptoast').innerHTML='<div class="msg red">Dê um nome ao produto.</div>'; return; }
      var rec={id:p.id||uid(),n:n,cat:p.cat,custo:c,aj:p.aj||0,ean:String(p.ean||'').trim(),atual:num(p.atual),mkt:num(p.mkt),ts:Date.now()};
      var i=S.prods.findIndex(function(x){ return x.id===rec.id; });
      if(i>=0) S.prods[i]=rec; else S.prods.push(rec);
      p.id=rec.id; save();
      var r=calcProd(rec);
      var prox=S.prods.filter(function(x){ return x.id!==rec.id && calcProd(x).st==='none'; });

      copyText(t2,function(){ $('pmsg').innerHTML='<div class="msg green">Lista copiada. É só colar no WhatsApp.</div>'; },function(){ $('pmsg').innerHTML='<div class="msg red">Não consegui copiar automaticamente.</div>'; });

    if(t.id==='csv'){
      var hoje=new Date(), dstr=hoje.getFullYear()+'-'+('0'+(hoje.getMonth()+1)).slice(-2)+'-'+('0'+hoje.getDate()).slice(-2);
      var sit=function(st){ return st==='none'?'Falta o custo':(st==='red'?'Abaixo do mínimo':(st==='amber'?'Revisar arredondamento':'OK')); };
      var r2=function(n){ return Math.round(n*100)/100; };
      var cab=['Produto','Código de barras','Categoria','Custo','Margem da categoria (%)','Margem usada (%)','Preço sugerido','Preço praticado','Preço em uso','Margem real (%)','Preço mínimo','Lucro líquido por unidade','Situação','Atualizado em'];
      var ordenados=S.prods.slice().sort(function(a,b){ return a.n.localeCompare(b.n,'pt-BR'); });
      var linhas=ordenados.map(function(p){

          (tem&&r.usado>0)?r2(r.margem*100):'',(tem&&r.min>0)?Math.ceil(r.min*100)/100:'',(tem&&r.usado>0)?r2(r.vL):'',sit(r.st),p.ts?new Date(p.ts).toLocaleDateString('pt-BR'):''];
      });
      var st2=stats();
      var resumo=[['Negócio',S.cfg.neg||''],['Exportado em',hoje.toLocaleDateString('pt-BR')],['Produtos',st2.n],['Abaixo do preço mínimo',st2.red],['Sem custo',st2.sc],['Margem média real (%)',r2(st2.mm*100)],
        ['Imposto (%)',cfgN('imp')],['Cartão e Pix (%)',cfgN('taxa')],['Furtos e perdas (%)',cfgN('perd')],['Despesas fixas por mês',cfgN('desp')],['Vendas por mês',cfgN('vend')]];
      var okMsg=function(nome){ $('pmsg').innerHTML='<div class="msg green">'+S.prods.length+' produtos exportados no arquivo '+nome+'.</div>'; toast('Planilha exportada'); };
      var viaCSV=function(){
        try{ baixar('produtos-precos-'+dstr+'.csv',[cab].concat(linhas.map(function(l){ return l.map(function(v){ return typeof v==='number'?String(v).replace('.',','):v; }); }))); okMsg('produtos-precos-'+dstr+'.csv'); }
        catch(err){ $('pmsg').innerHTML='<div class="msg red">Não consegui baixar neste aparelho. Use “Copiar lista”.</div>'; }
      };
      $('pmsg').innerHTML='<div class="msg info">Preparando a planilha…</div>';
      loadXLSX(function(err){
        if(err){ viaCSV(); return; }
        try{
          var X=window.XLSX, wb=X.utils.book_new(), ws=X.utils.aoa_to_sheet([cab].concat(linhas));
          ws['!cols']=[{wch:38},{wch:16},{wch:24},{wch:10},{wch:14},{wch:14},{wch:14},{wch:14},{wch:12},{wch:13},{wch:13},{wch:16},{wch:22},{wch:13}];
          X.utils.book_append_sheet(wb,ws,'Produtos');
          var w2=X.utils.aoa_to_sheet(resumo); w2['!cols']=[{wch:28},{wch:22}]; X.utils.book_append_sheet(wb,w2,'Resumo');

    // importar

      try{ baixar('modelo-produtos.csv',[['Nome','Custo','Categoria','Código de barras','Preço de venda praticado'],['Arroz tipo 1 5kg','24,50','Cesta básica','7890000000001','32,90'],['Refrigerante cola 2L','7,20','Refrigerantes e sucos','','']]);
        $('modmsg').innerHTML='<div class="msg green">Modelo baixado: modelo-produtos.csv.</div>'; }

    }
    if(t.id==='impVolta'){ V.imp.step=Math.max(1,V.imp.step-1); render(); window.scrollTo(0,0); return; }
    if(t.id==='impVai'){
      var I=V.imp;
      if(I.step===2){
        if(I.map.nome<0){ $('imsg').innerHTML='<div class="msg red">Escolha a coluna com o nome do produto para continuar.</div>'; return; }
        if(I.map.custo>=0&&I.map.custo===I.map.atual){ $('imsg').innerHTML='<div class="msg red">A mesma coluna foi escolhida para custo e para preço praticado. Escolha colunas diferentes.</div>'; return; }
        revisar(); I.step=3; render(); window.scrollTo(0,0); return;
      }
      if(I.step===3){ if(!I.rev.ok.length) return; importar(); return; }
    }
    if(d.undo){
      var L=(S.imports||[]).filter(function(x){ return x.id===d.undo; })[0]; if(!L) return;
      if(!confirma('undo'+d.undo,'undomsg','Excluir a importação de “'+esc(L.file||'planilha')+'”? Saem '+L.novos.length+' produtos novos e '+L.atualizados.length+' voltam ao que eram.')) return;
      var rr=desfazer(d.undo);
      V.undoMsg='Importação excluída: '+rr.rem+' produto'+(rr.rem===1?'':'s')+' removido'+(rr.rem===1?'':'s')+(rr.rest?' e '+rr.rest+' restaurado'+(rr.rest===1?'':'s'):'')+'.';
      V.imp={step:1}; render(); window.scrollTo(0,0); return;

    if(t.id==='selOn'){ V.sel={}; render(); return; }

    if(t.id==='selAll'){

      return;

    if(t.id==='w2'){
      if(V.wpub!==S.cfg.pub || !S.cfg.setup){ var aj2=PUB[V.wpub].aj; S.cats.forEach(function(c){ var m=/^c(\d+)$/.exec(c.id); if(m&&BASE[+m[1]]) c.m=Math.max(10,BASE[+m[1]][1]+aj2); }); }

    var t=e.target, id=t.id;
    if(id==='hbusca'){ V.hb=t.value; updHome(); return; }
    if(id==='qcusto'){ V.qc.custo=t.value; updQuick(); return; }
    if(id==='qnome'){ V.qc.nome=t.value; return; }
    if(id==='pbusca'){ V.busca=t.value; updLista(); return; }
    if(V.screen==='prod'){
      var map={fn:'n',fe:'ean',fk:'custo',fa:'atual',fm:'mkt'};
      if(map[id]){ V.edit[map[id]]=t.value; if($('ptoast')) $('ptoast').innerHTML=''; if(id!=='fn'&&id!=='fe') updProd(); }
      return;
    }
    if(t.dataset.cfg){ S.cfg[t.dataset.cfg]=t.value; save(); updMeta(); return; }
    if(id==='nmeta'){ S.cfg.meta=t.value; save(); updMeta(); return; }
    if(id==='nneg'){ S.cfg.neg=t.value.trim(); save(); return; }
    if(t.dataset.ci!=null){
      var c=S.cats[+t.dataset.ci]; if(!c) return;
      if(t.dataset.ck==='m'){ var v=num(t.value); c.m=Math.min(Math.max(v,0),90); if(v>90) $('catmsg').innerHTML='<div class="msg red">Margem máxima: 90%.</div>'; }
      else c.n=t.value;
      save(); updMeta(); return;
    }
  });
  root.addEventListener('change',function(e){
    var t=e.target, id=t.id;
    if(id==='qcat'){ V.qc.cat=t.value; updQuick(); return; }
    if(id==='fc'){ V.edit.cat=t.value; V.edit.aj=0; updProd(); return; }
    if(id==='narred'){ S.cfg.arred=t.value; save(); return; }
    if(id==='arq'&&t.files&&t.files[0]){ lerArquivo(t.files[0]); return; }
    if(id==='feFoto'&&t.files&&t.files[0]){
      var fbox=$('eanmsg'); fbox.innerHTML='<div class="msg info">Lendo o código…</div>';
      lerCodigo(t.files[0],function(code,mot){
        t.value='';
        if(!code){ fbox.innerHTML='<div class="msg amber">'+msgFalha(mot)+'</div>'; return; }
        V.edit.ean=code; $('fe').value=code;
        var outro=porEan(code,V.edit.id);
        fbox.innerHTML = outro ? '<div class="msg amber">Código '+esc(code)+' lido. Ele já está no produto “'+esc(outro.n)+'”. <button type="button" class="btn plain" data-prod="'+esc(outro.id)+'">Abrir esse produto</button></div>'
                               : '<div class="msg green">Código '+esc(code)+' lido. Salve para guardar.</div>';
      });
      return;
    }
    if(id==='hFoto'&&t.files&&t.files[0]){
      var hbox=$('hfotomsg'); hbox.innerHTML='<div class="msg info">Lendo o código…</div>';
      lerCodigo(t.files[0],function(code,mot){
        t.value='';
        if(!code){ hbox.innerHTML='<div class="msg amber">'+msgFalha(mot)+'</div>'; return; }
        var achado=porEan(code,null);
        if(achado){ hbox.innerHTML=''; openProd(achado.id); return; }
        V.hb=code; $('hbusca').value=code; updHome();
        hbox.innerHTML='<div class="msg info">O código '+esc(code)+' ainda não está cadastrado.<br><button type="button" class="btn ghost" id="cadEan" data-ean="'+esc(code)+'" style="margin-top:8px">Cadastrar produto com este código</button></div>';
      });
      return;
    }
    if(t.dataset.map){ V.imp.map[t.dataset.map]=+t.value; updPrev(); return; }
    if(id==='defcat'){ V.imp.defCat=t.value; return; }
    if(id==='atualizar'){ V.imp.atualizar=t.checked; return; }
  });
  root.addEventListener('toggle',function(e){
    if(e.target.id==='dnum') V.openNum=e.target.open;
    if(e.target.id==='dcat') V.openCat=e.target.open;
  },true);
  // arrastar arquivo
  root.addEventListener('dragover',function(e){ if(e.target.closest&&e.target.closest('.drop')){ e.preventDefault(); } });
  root.addEventListener('drop',function(e){
    var dz=e.target.closest&&e.target.closest('.drop'); if(!dz) return; e.preventDefault();
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) lerArquivo(f);
  });

  load(); V.wpub=S.cfg.pub||'B'; render();
  if('serviceWorker' in navigator && location.protocol==='https:' && !/claude|claudeusercontent/.test(location.hostname)){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
